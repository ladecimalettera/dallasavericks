name: dati-espn-mattina

on:
  schedule:
    - cron: "10 5 * * *"   # 6:10 in Italia con l'ora solare (novembre-marzo)
    - cron: "10 4 * * *"   # 6:10 in Italia con l'ora legale (da fine marzo)
  workflow_dispatch: {}      # bottone "Run workflow" per lanciarlo a mano

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install espn-api==1.0.1 requests
      - run: python fetch.py
        env:
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          SWID: ${{ secrets.SWID }}
          LEAGUE_ID: ${{ secrets.LEAGUE_ID }}
          SCHEDULED: ${{ github.event_name == 'schedule' && '1' || '0' }}
      - name: Salva il file
        run: |
          git config user.name "fanta-bot"
          git config user.email "fanta-bot@users.noreply.github.com"
          git add data/latest.json || true
          git commit -m "dati $(date -u +%F)" || echo "nessuna modifica"
          git push
